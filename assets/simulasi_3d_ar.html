<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Structora AR & AI Simulation</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Three.js & OrbitControls -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            user-select: none;
            -webkit-user-select: none;
            overflow: hidden;
            background-color: transparent !important;
        }
        .glass-panel {
            background: rgba(15, 23, 42, 0.88);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.12);
        }
        canvas {
            display: block;
            outline: none;
            touch-action: none;
        }
    </style>
</head>
<body class="bg-transparent text-slate-100 h-screen w-screen flex flex-col">

<!-- Area 3D Canvas Transparan Full Screen untuk Overlay Kamera -->
<div id="canvas-container" class="relative w-full h-full shrink-0">
    <!-- Notifikasi Toast Status ML Kit Object Detection -->
    <div id="toast" class="absolute top-4 left-1/2 -translate-x-1/2 z-10 glass-panel px-4 py-1.5 rounded-full text-[11px] font-bold text-white shadow-2xl opacity-100 transition-opacity duration-300 pointer-events-none flex items-center space-x-2 border border-cyan-500/40">
        <i class="fa-solid fa-camera-rotate text-cyan-400 text-xs animate-spin"></i>
        <span id="toast-msg">AR AI Scanner Ready</span>
    </div>
</div>

<script>
    let scene, camera, renderer, controls;
    let currentTab = 'stack';
    let currentLang = 'id';
    let stackGroup, queueGroup, linkedListGroup, sortSearchGroup;

    function showToast(msg) {
        const toast = document.getElementById('toast');
        document.getElementById('toast-msg').innerText = msg;
        toast.classList.remove('opacity-0');
        toast.classList.add('opacity-100');
        setTimeout(() => {
            toast.classList.remove('opacity-100');
            toast.classList.add('opacity-0');
        }, 2500);
    }

    window.setMlKitDetectedObject = function(label, detectedTab) {
        if (detectedTab) {
            window.switchTab(detectedTab);
        }
        showToast(`AI ML Kit: Terdeteksi "${label}" -> Modul ${detectedTab.toUpperCase()}`);
        if (window.detectAndAnchorObject) {
            window.detectAndAnchorObject();
        }
    };

    window.setLanguage = function(lang) {
        currentLang = lang;
    };

    window.detectAndAnchorObject = function() {
        if (!scene) return;
        let targetGroup = null;
        if (currentTab === 'stack') targetGroup = stackGroup;
        else if (currentTab === 'queue') targetGroup = queueGroup;
        else if (currentTab === 'linkedlist') targetGroup = linkedListGroup;
        else if (currentTab === 'sortsearch') targetGroup = sortSearchGroup;

        if (targetGroup) {
            let count = 0;
            const interval = setInterval(() => {
                count++;
                targetGroup.position.y = (count % 2 === 0) ? 0.3 : 0;
                if (count >= 6) {
                    clearInterval(interval);
                    targetGroup.position.y = 0;
                }
            }, 100);
        }
    };

    function createTextTexture(text, bgColor = '#0f172a', textColor = '#00f0ff') {
        const canvas = document.createElement('canvas');
        canvas.width = 256;
        canvas.height = 128;
        const ctx = canvas.getContext('2d');

        ctx.fillStyle = bgColor;
        ctx.beginPath();
        if (ctx.roundRect) {
            ctx.roundRect(0, 0, canvas.width, canvas.height, 16);
        } else {
            ctx.rect(0, 0, canvas.width, canvas.height);
        }
        ctx.fill();

        ctx.strokeStyle = textColor;
        ctx.lineWidth = 6;
        ctx.stroke();

        ctx.fillStyle = textColor;
        ctx.font = 'bold 36px Plus Jakarta Sans, sans-serif';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(text, canvas.width / 2, canvas.height / 2);

        return new THREE.CanvasTexture(canvas);
    }

    function buildArBoundingBoxes() {
        // 1. Stack AR Overlay (Bounding box neon + TOP pointer)
        const stackBoxGeo = new THREE.BoxGeometry(3.5, 3.5, 3.5);
        const stackBoxMat = new THREE.MeshBasicMaterial({ color: 0x00f0ff, wireframe: true });
        const stackBox = new THREE.Mesh(stackBoxGeo, stackBoxMat);
        stackBox.position.set(0, 0, 0);
        stackGroup.add(stackBox);

        const stackLabelTex = createTextTexture("TOP (LIFO)", '#0f172a', '#10b981');
        const stackLabelGeo = new THREE.PlaneGeometry(2.5, 1.2);
        const stackLabelMat = new THREE.MeshBasicMaterial({ map: stackLabelTex, transparent: true, side: THREE.DoubleSide });
        const stackLabel = new THREE.Mesh(stackLabelGeo, stackLabelMat);
        stackLabel.position.set(0, 2.3, 0);
        stackGroup.add(stackLabel);

        // 2. Queue AR Overlay (FRONT & REAR pointers)
        const queueFrontLabelTex = createTextTexture("FRONT (FIFO)", '#0f172a', '#10b981');
        const queueFrontGeo = new THREE.PlaneGeometry(2.5, 1.2);
        const queueFrontMat = new THREE.MeshBasicMaterial({ map: queueFrontLabelTex, transparent: true, side: THREE.DoubleSide });
        const queueFront = new THREE.Mesh(queueFrontGeo, queueFrontMat);
        queueFront.position.set(-2.5, 1.5, 0);
        queueGroup.add(queueFront);

        const queueRearLabelTex = createTextTexture("REAR (IN)", '#0f172a', '#00f0ff');
        const queueRearGeo = new THREE.PlaneGeometry(2.2, 1.1);
        const queueRearMat = new THREE.MeshBasicMaterial({ map: queueRearLabelTex, transparent: true, side: THREE.DoubleSide });
        const queueRear = new THREE.Mesh(queueRearGeo, queueRearMat);
        queueRear.position.set(2.5, 1.5, 0);
        queueGroup.add(queueRear);

        // 3. Linked List AR Overlay (HEAD & NULL laser connector)
        const llHeadTex = createTextTexture("HEAD", '#0f172a', '#00f0ff');
        const llHeadGeo = new THREE.PlaneGeometry(2.0, 1.0);
        const llHeadMat = new THREE.MeshBasicMaterial({ map: llHeadTex, transparent: true, side: THREE.DoubleSide });
        const llHead = new THREE.Mesh(llHeadGeo, llHeadMat);
        llHead.position.set(-3.5, 1.5, 0);
        linkedListGroup.add(llHead);

        const llNullTex = createTextTexture("NULL", '#0f172a', '#ef4444');
        const llNullGeo = new THREE.PlaneGeometry(2.0, 1.0);
        const llNullMat = new THREE.MeshBasicMaterial({ map: llNullTex, transparent: true, side: THREE.DoubleSide });
        const llNull = new THREE.Mesh(llNullGeo, llNullMat);
        llNull.position.set(3.5, 1.5, 0);
        linkedListGroup.add(llNull);

        // Laser Arrow Connector
        const laserGeo = new THREE.CylinderGeometry(0.08, 0.08, 6.0, 16);
        const laserMat = new THREE.MeshBasicMaterial({ color: 0x00f0ff });
        const laser = new THREE.Mesh(laserGeo, laserMat);
        laser.rotation.z = Math.PI / 2;
        laser.position.set(0, 1.5, 0);
        linkedListGroup.add(laser);

        // 4. Sort & Search AR Overlay (Number badges)
        const sortTex1 = createTextTexture("[Val: 12]", '#0f172a', '#f59e0b');
        const sortGeo1 = new THREE.PlaneGeometry(1.8, 0.9);
        const sortMat1 = new THREE.MeshBasicMaterial({ map: sortTex1, transparent: true, side: THREE.DoubleSide });
        const sortLabel1 = new THREE.Mesh(sortGeo1, sortMat1);
        sortLabel1.position.set(-2.5, 1.5, 0);
        sortSearchGroup.add(sortLabel1);

        const sortTex2 = createTextTexture("[Val: 89]", '#0f172a', '#8b5cf6');
        const sortGeo2 = new THREE.PlaneGeometry(1.8, 0.9);
        const sortMat2 = new THREE.MeshBasicMaterial({ map: sortTex2, transparent: true, side: THREE.DoubleSide });
        const sortLabel2 = new THREE.Mesh(sortGeo2, sortMat2);
        sortLabel2.position.set(2.5, 1.5, 0);
        sortSearchGroup.add(sortLabel2);
    }

    function initScene() {
        const container = document.getElementById('canvas-container');

        scene = new THREE.Scene();
        scene.background = null;

        camera = new THREE.PerspectiveCamera(45, container.clientWidth / container.clientHeight, 0.1, 1000);
        camera.position.set(0, 5, 12);

        renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(container.clientWidth, container.clientHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.setClearColor(0x000000, 0);
        container.appendChild(renderer.domElement);

        controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;

        const ambientLight = new THREE.AmbientLight(0xffffff, 1.2);
        scene.add(ambientLight);

        stackGroup = new THREE.Group();
        queueGroup = new THREE.Group();
        linkedListGroup = new THREE.Group();
        sortSearchGroup = new THREE.Group();

        scene.add(stackGroup);
        scene.add(queueGroup);
        scene.add(linkedListGroup);
        scene.add(sortSearchGroup);

        buildArBoundingBoxes();

        window.addEventListener('resize', () => {
            camera.aspect = container.clientWidth / container.clientHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(container.clientWidth, container.clientHeight);
        });
    }

    window.switchTab = function(tabName) {
        currentTab = tabName;
        stackGroup.visible = (tabName === 'stack');
        queueGroup.visible = (tabName === 'queue');
        linkedListGroup.visible = (tabName === 'linkedlist');
        sortSearchGroup.visible = (tabName === 'sortsearch');
    };

    function init() {
        initScene();
        window.switchTab('stack');

        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            renderer.render(scene, camera);
        }
        animate();
    }

    window.onload = init;
</script>
</body>
</html>
